$kind: http-request
name: Archival delete (moves the row to the recycle bin).
description: "Archival delete (moves the row to the recycle bin). Scope: products:delete."
url: "{{baseUrl}}/api/v1/products/{{productsId}}"
method: DELETE
headers:
  - key: Accept
    value: application/json
  - key: Idempotency-Key
    value: ""
    disabled: true
    description: Optional. Retries with the same key replay the first response (n8n-safe).
  - key: If-Match
    value: ""
    disabled: true
    description: Optional. Paste the ETag you fetched; the write returns 412 if the record changed since (optimistic concurrency).
order: 8000
