$kind: http-request
name: Fetch one products by id.
description: "Fetch one products by id. Scope: products:read."
url: "{{baseUrl}}/api/v1/products/{{productsId}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: If-None-Match
    value: ""
    disabled: true
    description: Optional. Paste a prior ETag to get 304 Not Modified when unchanged.
order: 5000
