$kind: http-request
name: Create a products record (send a JSON array of objects to bulk-create, all-or-nothing).
description: "Create a products record (send a JSON array of objects to bulk-create, all-or-nothing). Scope: products:write."
url: "{{baseUrl}}/api/v1/products"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Idempotency-Key
    value: ""
    disabled: true
    description: Optional. Retries with the same key replay the first response (n8n-safe).
  - key: Content-Type
    value: application/json
body:
  type: text
  content: |-
    {
        "sku": "sku",
        "name": "name",
        "price": 9.99,
        "status": "active"
    }
order: 2000
