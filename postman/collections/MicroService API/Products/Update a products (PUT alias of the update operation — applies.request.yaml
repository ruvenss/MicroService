$kind: http-request
name: Update a products (PUT alias of the update operation — applies the fields sent; clients that default to PUT can use it).
description: "Update a products (PUT alias of the update operation — applies the fields sent; clients that default to PUT can use it). Scope: products:write."
url: "{{baseUrl}}/api/v1/products/{{productsId}}"
method: PUT
headers:
  - key: Accept
    value: application/json
  - key: Idempotency-Key
    value: ""
    disabled: true
    description: Optional. Retries with the same key replay the first response (n8n-safe).
  - key: If-Match
    value: ""
    disabled: true
    description: Optional. Paste the ETag you fetched; the write returns 412 if the record changed since (optimistic concurrency).
  - key: Content-Type
    value: application/json
body:
  type: text
  content: |-
    {
        "sku": "sku",
        "name": "name",
        "price": 9.99,
        "status": "active"
    }
order: 7000
