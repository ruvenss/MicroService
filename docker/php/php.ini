; MicroService production PHP config — stealth + performance.

; Never advertise PHP.
expose_php = Off

; Keep errors out of responses in production (errors are JSON/problem+json).
display_errors = Off
log_errors = On

; Filesystem lookups.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; OPcache + JIT — enable once the opcache extension is added to the image
; (deferred: it does not build cleanly via docker-php-ext-install on PHP 8.5 yet).
; opcache.enable = 1
; opcache.memory_consumption = 128
; opcache.interned_strings_buffer = 16
; opcache.max_accelerated_files = 20000
; opcache.validate_timestamps = 0
; opcache.jit = tracing
; opcache.jit_buffer_size = 64M
