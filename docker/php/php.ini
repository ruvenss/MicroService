; MicroService production PHP config — stealth + performance.

; Never advertise PHP.
expose_php = Off

; Keep errors out of responses in production (errors are JSON/problem+json).
; display_startup_errors too, so an extension/ini problem at worker start can never
; surface engine details or file paths — it is logged, never shown.
display_errors = Off
display_startup_errors = Off
log_errors = On

; Filesystem lookups.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; ── OPcache (Zend OPcache is compiled into php:8.5, just configured here) ──
; Code is baked into the image, so timestamp validation is off for max speed.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; Preload the framework + core classes into shared memory at server start, so
; they are compiled and linked once for all workers (lower per-request latency
; and memory). Runs as the Apache user; the script emits no output.
opcache.preload = /var/www/html/preload.php
opcache.preload_user = www-data

; JIT — helps CPU-bound paths; most request time here is I/O, so gains are
; modest, but it's a safe default. (tracing mode, 64M buffer.)
opcache.jit = tracing
opcache.jit_buffer_size = 64M
