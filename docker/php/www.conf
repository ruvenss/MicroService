; PHP-FPM pool for the MicroService. Apache (mpm_event) proxies PHP here over
; FastCGI. Worker count is the key capacity knob: with persistent DB connections
; (pConnect) each busy worker holds one MySQL connection, so size the pool such
; that Σ pm.max_children across all app containers ≤ the external MySQL
; max_connections (ARCHITECTURE §17.2). Tune pm.max_children per deployment.
[www]
user  = www-data
group = www-data

; TCP socket on loopback — Apache proxies to it via SetHandler proxy:fcgi.
listen       = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data

pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests      = 1000

; Kill any request still running after 30s and recycle the worker. Without this a
; hung request (e.g. a stalled external DB) would pin a worker forever and, under
; load, exhaust the pool — a self-inflicted DoS. Bounds worst-case latency and
; keeps the pool healthy if the service is exposed.
request_terminate_timeout = 30s

; Only .php may be executed by the pool (defence-in-depth against a stray script).
security.limit_extensions = .php

; NOTE: we do NOT set `php_admin_value[disable_functions]` here, deliberately.
; Disabling functions mutates PHP's internal function table and — on this PHP 8.5
; build — corrupted an UNRELATED internal call: CodeIgniter's `render_backtrace`
; (Common.php) executed `var_export($arg, true)` as `memory_reset_peak_usage($arg, true)`,
; throwing `ArgumentCountError` while rendering ANY exception that carried arguments.
; The effect was severe: every 500 was logged as that bogus ArgumentCountError instead
; of the real cause (e.g. a "Duplicate entry" DB error) — a total error-log blind spot —
; and the aborted exception path once leaked an open transaction (30s lock-wait hang).
; The shell/process-exec block was only thin defence-in-depth (the CRUD engine never
; shells out), so it is not worth breaking all error handling. Re-introduce the same
; hardening the non-corrupting way — a container seccomp profile denying execve/fork —
; if desired. See docs/ARCHITECTURE.md §18.3.

; Keep the container's environment (DB_HOST, DB_USER, WEBHOOK_*, …) visible to
; PHP's getenv()/env() — with FPM this replaces the mod_php vhost `PassEnv`.
clear_env = no

; Never advertise PHP / expose FPM status to the outside.
; (No pm.status_path / ping.path — nothing to probe.)
