; PHP-FPM pool for the MicroService. Apache (mpm_event) proxies PHP here over
; FastCGI. Worker count is the key capacity knob: with persistent DB connections
; (pConnect) each busy worker holds one MySQL connection, so size the pool such
; that Σ pm.max_children across all app containers ≤ the external MySQL
; max_connections (ARCHITECTURE §17.2). Tune pm.max_children per deployment.
[www]
user  = www-data
group = www-data

; TCP socket on loopback — Apache proxies to it via SetHandler proxy:fcgi.
listen       = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data

pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests      = 1000

; Kill any request still running after 30s and recycle the worker. Without this a
; hung request (e.g. a stalled external DB) would pin a worker forever and, under
; load, exhaust the pool — a self-inflicted DoS. Bounds worst-case latency and
; keeps the pool healthy if the service is exposed.
request_terminate_timeout = 30s

; Only .php may be executed by the pool (defence-in-depth against a stray script).
security.limit_extensions = .php

; Keep the container's environment (DB_HOST, DB_USER, WEBHOOK_*, …) visible to
; PHP's getenv()/env() — with FPM this replaces the mod_php vhost `PassEnv`.
clear_env = no

; Never advertise PHP / expose FPM status to the outside.
; (No pm.status_path / ping.path — nothing to probe.)
