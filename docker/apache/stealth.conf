# Anti-fingerprinting at the web-server layer (ARCHITECTURE §18.2).
# mod_security's SecServerSignature overwrites the Server header with a neutral
# token so the response never reveals Apache/PHP. Two requirements:
#   - the rule engine must be ON (DetectionOnly does not rewrite the header);
#   - ServerTokens must be Full — mod_security overwrites the signature *in place*,
#     so the full string must exist for the replacement to fit (with Prod the
#     header is pre-truncated to "Apache" and cannot be replaced).
# The engine loads no rule sets — it is on purely to mask the signature.
ServerTokens Full
ServerSignature Off
TraceEnable Off

<IfModule mod_security2.c>
    SecRuleEngine On
    SecServerSignature "MicroService"
    SecRequestBodyAccess Off
    SecResponseBodyAccess Off
    SecAuditEngine Off
</IfModule>
