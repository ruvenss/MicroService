# Anti-fingerprinting at the web-server layer (ARCHITECTURE §18.2).
# mod_security's SecServerSignature overwrites the Server header with a neutral
# token so the response never reveals Apache/PHP. Two requirements:
#   - the rule engine must be ON (DetectionOnly does not rewrite the header);
#   - ServerTokens must be Full — mod_security overwrites the signature *in place*,
#     so the full string must exist for the replacement to fit (with Prod the
#     header is pre-truncated to "Apache" and cannot be replaced).
# The engine loads no rule sets — it is on purely to mask the signature.
ServerTokens Full
ServerSignature Off
TraceEnable Off

<IfModule mod_security2.c>
    SecRuleEngine On
    SecServerSignature "MicroService"

    # Edge DoS ceiling — enforced HERE, not by the vhost's LimitRequestBody. All API
    # traffic is handled by mod_proxy_fcgi (`SetHandler proxy:fcgi://` in the vhost),
    # and Apache's core LimitRequestBody is NOT consulted on that proxied path: a 10 MB
    # POST streams straight to PHP-FPM. mod_security's request-body phase (phase 2) runs
    # *before* the FastCGI handler forwards the body, so a SecRequestBody* limit rejects
    # an oversized body at the web server (neutral 413 via ErrorDocument) before FPM ever
    # sees it. For JSON — a non-upload body — the limit that actually applies is
    # SecRequestBodyNoFilesLimit, so it must be set too (not just SecRequestBodyLimit).
    # 2 MiB coarse edge, comfortably above the app's precise 1 MiB ContentGuard contract,
    # so ContentGuard stays the exact gate; InMemoryLimit == limit so nothing spools to
    # disk. Keep the value ≥ ContentGuard::MAX_BODY_BYTES (ApacheStealthTest enforces it).
    SecRequestBodyAccess On
    SecRequestBodyLimit 2097152
    SecRequestBodyNoFilesLimit 2097152
    SecRequestBodyInMemoryLimit 2097152
    SecRequestBodyLimitAction Reject

    SecResponseBodyAccess Off
    SecAuditEngine Off
</IfModule>
