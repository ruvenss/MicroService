# Anti-fingerprinting at the web-server layer (ARCHITECTURE §18.2).
# - ServerTokens Prod strips the Apache version from the Server header.
# - mod_security's SecServerSignature replaces it entirely with a neutral token,
#   so the response never reveals Apache/PHP at all.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<IfModule mod_security2.c>
    SecRuleEngine DetectionOnly
    SecServerSignature "MicroService"
</IfModule>
