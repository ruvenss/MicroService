<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # PHP runs in a separate PHP-FPM pool (mpm_event front, FastCGI back). Route
    # any .php request to FPM over the loopback socket. The app's config vars
    # (DB_*, WEBHOOK_*, …) reach PHP through the pool's `clear_env = no` — not a
    # vhost PassEnv, which does not cross the FastCGI boundary.
    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://127.0.0.1:9000"
    </FilesMatch>

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Anti-fingerprinting: never emit Apache's default ETag. Its `inode-size-mtime`
    # (here `size-mtime`) shape is a recognisable Apache signature — and historically
    # leaked the file inode (CVE-2003-1418). The only static assets we serve
    # (error.json, robots.txt) are tiny and need no validators, so drop ETags entirely.
    FileETag None

    # Edge DoS ceiling for NON-proxied requests only (e.g. static files under
    # DocumentRoot). Apache's core LimitRequestBody is NOT enforced on the
    # `SetHandler proxy:fcgi://` path that serves the whole API — a huge POST would
    # stream straight to PHP-FPM. The real edge cap on API bodies is mod_security's
    # SecRequestBodyNoFilesLimit (see stealth.conf), which rejects in phase 2 before
    # FPM sees the body. Kept here as belt-and-suspenders, aligned to the same 2 MiB.
    # The app applies a tighter 1 MiB contract limit in ContentGuard (clean 413).
    LimitRequestBody 2097152

    # Never let Apache's own error pages leak the engine. ANY server-level failure
    # Apache handles itself — a denied dotfile (403), a disabled method like TRACE
    # (405), an oversized body (413), an over-long URI (414), oversized headers (431),
    # a malformed request (400), a bad gateway / backend-down (5xx) — is answered with
    # a neutral static problem+json instead of Apache's recognisable default HTML.
    # App-level 4xx/5xx already return problem+json from the front controller.
    #
    # ErrorDocument has NO wildcard, so every status Apache can emit at the CORE level
    # (before the request reaches PHP) must be listed, or that one leaks its branded
    # default HTML — e.g. a >8 KiB request line returns Apache's "414 Request-URI Too
    # Long" page, a recognisable fingerprint even with the Server header masked.
    # ApacheStealthTest enforces this full set stays mapped.
    ErrorDocument 400 /error.json
    ErrorDocument 403 /error.json
    ErrorDocument 404 /error.json
    ErrorDocument 405 /error.json
    ErrorDocument 406 /error.json
    ErrorDocument 408 /error.json
    ErrorDocument 411 /error.json
    ErrorDocument 413 /error.json
    ErrorDocument 414 /error.json
    ErrorDocument 417 /error.json
    ErrorDocument 431 /error.json
    ErrorDocument 500 /error.json
    ErrorDocument 501 /error.json
    ErrorDocument 502 /error.json
    ErrorDocument 503 /error.json
    ErrorDocument 505 /error.json
    <Files "error.json">
        ForceType application/problem+json
        # This static body is served on Apache-handled errors (403/405/413/…) that never
        # reach PHP, so re-assert the stealth posture the app's Stealth filter would add
        # and strip the static-file headers that fingerprint the server or disclose the
        # image build time. Keeps the engine-neutral error response identical whether it
        # came from the app or from Apache itself.
        Header always set Cache-Control "no-store"
        Header always set X-Robots-Tag "noindex, nofollow"
        # Mirror the full security-header set the app's Stealth filter puts on every
        # response (nosniff / frame / referrer / CSP / permissions). Without these, an
        # Apache-handled error (TRACE 405, denied dotfile 403, oversized-body 413,
        # backend-down 502/503) both is less hardened *and* carries a different header
        # set than an app error — a fingerprint that the response came from the proxy,
        # not the app. Keep these values byte-identical to App\Filters\Stealth::harden;
        # ApacheStealthTest derives the required set from that source so they can't drift.
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "no-referrer"
        Header always set Content-Security-Policy "default-src 'none'; frame-ancestors 'none'"
        Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
        # Strip the static-file validators the file handler adds. These land in the
        # normal headers_out table (the error.json subrequest succeeds internally), so
        # the plain `unset` is required; the `always` form covers the error table too.
        Header unset Last-Modified
        Header always unset Last-Modified
        Header unset Accept-Ranges
        Header always unset Accept-Ranges
    </Files>

    # NOTE: PHP is hidden at the APPLICATION layer by the HidePhp filter, which
    # returns the same neutral problem+json 404 as any unknown path for any URI
    # referencing .php (bare /index.php, /phpinfo.php, /index.php/<route> PATH_INFO).
    # We deliberately do NOT use a server-context `RewriteRule ^ - [R=404]` here:
    # mod_rewrite's R=404 bypasses ErrorDocument and would emit Apache's default
    # branded 404 HTML — an engine leak. Routing .php through the front controller
    # lets the app answer neutrally instead.

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
