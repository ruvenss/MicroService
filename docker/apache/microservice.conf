<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # Apache/mod_php does NOT expose the container's OS environment to PHP's
    # getenv() by default — pass through the config vars the app reads (see
    # Config\App / Config\Database). Underscore names only (dots don't propagate).
    PassEnv CI_ENVIRONMENT APP_BASE_URL DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD DB_PERSISTENT
    PassEnv WEBHOOK_URL WEBHOOK_SECRET WEBHOOK_EVENTS

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Edge DoS ceiling: refuse abusive request bodies before PHP buffers them
    # (8 MiB). The app applies a tighter 1 MiB contract limit in ContentGuard and
    # returns a clean problem+json 413; this catches anything past the hard cap.
    LimitRequestBody 8388608

    # Never let Apache's own error pages leak the engine. Server-level failures
    # (oversized body, malformed request, backend down) are answered with a
    # neutral static problem+json instead of the default branded HTML. App-level
    # 4xx/5xx already return problem+json from the front controller.
    ErrorDocument 400 /error.json
    ErrorDocument 413 /error.json
    ErrorDocument 500 /error.json
    ErrorDocument 502 /error.json
    ErrorDocument 503 /error.json
    <Files "error.json">
        ForceType application/problem+json
    </Files>

    # Hide PHP at the vhost level too (the app's public/.htaccess also does this):
    # any direct client request for a .php file returns 404. Internal rewrites to
    # the front controller still work (THE_REQUEST holds only the original line).
    RewriteEngine On
    RewriteCond %{THE_REQUEST} \s/+[^?]*\.php[\s?/] [NC]
    RewriteRule ^ - [R=404,L]

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
