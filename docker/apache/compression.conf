# Response compression for the JSON API. n8n pulls list responses that are highly
# compressible (JSON is ~85% air), so gzip cuts bandwidth and latency materially.
# mod_deflate is already loaded; this just turns it on for our content types.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE application/json application/problem+json text/plain

    # CRITICAL: do NOT let compression rewrite the ETag. The application computes a
    # strong ETag (content hash) and handles If-None-Match/304 itself; Apache's
    # default behaviour of appending "-gzip" would make the client's returned
    # validator never match, silently breaking conditional GET. NoChange keeps the
    # app's ETag intact on both the compressed and identity representations.
    DeflateAlterETag NoChange

    # Some very old proxies mangle compressed responses; the standard guards.
    BrowserMatch ^Mozilla/4 gzip-only-text/html
    BrowserMatch ^Mozilla/4\.0[678] no-gzip
    Header append Vary Accept-Encoding
</IfModule>
