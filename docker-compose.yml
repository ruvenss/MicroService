# =============================================================================
#  Production-style stack: the Apache/PHP app image + a Redis sidecar.
#  The DATABASE IS EXTERNAL and never part of this stack (ARCHITECTURE §17).
#  For local prod-like runs it points at the dev MySQL from docker-compose.dev.yml
#  via host.docker.internal:${DB_PORT}. In real deployments, set DB_HOST to the
#  managed database. Secrets come from the host .env (gitignored).
#
#  Usage:  make build && make up        (or: docker compose up -d --build)
# =============================================================================
name: microservice

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
    image: microservice/app:latest
    container_name: microservice-app
    restart: unless-stopped
    ports:
      - "${APP_HOST_PORT:-8080}:80"
    # Config via UNDERSCORE-named env vars — dotted CI keys (database.default.*)
    # do not propagate through Apache/mod_php; the app maps these in Config\App /
    # Config\Database. The external DB never lives in this stack.
    environment: &app-env
      CI_ENVIRONMENT: production
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080/}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: "${DB_PORT:-3307}"
      DB_NAME: ${MYSQL_DATABASE:-microservice}
      DB_USER: ${MYSQL_USER:-microservice}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      DB_PERSISTENT: "true"
      # Shared cache / rate-limit / idempotency / counters via the Redis sidecar
      # (Config\Cache switches to the pure-PHP Predis handler when REDIS_HOST is set;
      # falls back to file cache automatically if Redis is unreachable).
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: "${REDIS_PORT:-6379}"
      # Outbound webhooks to n8n (empty = disabled). Delivered by webhooks:dispatch.
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      WEBHOOK_EVENTS: ${WEBHOOK_EVENTS:-*}
      # Retention windows for `maintenance:prune` (audit_log/recycle bin excluded).
      RETENTION_ACCESS_LOG_DAYS: ${RETENTION_ACCESS_LOG_DAYS:-30}
      RETENTION_DELIVERED_WEBHOOK_DAYS: ${RETENTION_DELIVERED_WEBHOOK_DAYS:-7}
      RETENTION_DEADLETTERED_WEBHOOK_DAYS: ${RETENTION_DEADLETTERED_WEBHOOK_DAYS:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: microservice-app-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]

  # Scheduler sidecar — same image, runs the spark CLI instead of Apache. Delivers
  # queued webhooks to n8n (webhooks:dispatch) on a short interval and prunes the
  # transient tables daily (maintenance:prune). Without it, enqueued webhooks would
  # never leave the outbox. Shares the app's env via the &app-env anchor so it reaches
  # the same DB / Redis / webhook config.
  scheduler:
    image: microservice/app:latest
    container_name: microservice-app-scheduler
    restart: unless-stopped
    command: ["/usr/local/bin/scheduler.sh"]
    # The image HEALTHCHECK probes Apache, which this service doesn't run — disable it so
    # the worker isn't falsely marked unhealthy.
    healthcheck:
      disable: true
    environment:
      <<: *app-env
      DISPATCH_INTERVAL: "${DISPATCH_INTERVAL:-30}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app
      - redis
